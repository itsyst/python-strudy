<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher · Python Study</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar" role="navigation">
    <div class="nav-inner">
      <a class="nav-brand" href="index.html" title="Home" style="text-decoration:none">
        <span class="logo-mark" aria-hidden="true">P</span>
        <span class="brand-text">Python Study</span>
      </a>
      <div class="nav-links">
        <a class="nav-btn" href="index.html">Student site</a>
        <span class="nav-btn active">Teacher</span>
      </div>
    </div>
  </header>

  <main id="app">
    <section class="view active admin-page">
      <p class="hero-badge">Teacher desk</p>
      <h1>Lab passcodes</h1>
      <p class="hero-sub" style="margin-left:0;text-align:left">
        Only the GitHub owner <strong>@itsyst</strong>, signed in to GitHub, can generate lab codes.
        Students and other GitHub users cannot open this desk.
      </p>

      <div id="admin-panel" class="admin-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <p>Teacher desk: GitHub owner @itsyst only</p>
    </div>
  </footer>

  <script src="assets/crypto.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const TOKEN_URL = "https://github.com/settings/tokens/new?scopes=repo&description=python-strudy-teacher";

    function fmt(ts) {
      if (!ts) return "—";
      return new Date(ts).toLocaleString();
    }

    function sess() {
      return PSCrypto.githubSession();
    }

    async function render() {
      const s = sess();
      if (!s || !s.token) {
        renderLogin();
        return;
      }
      const check = await PSCrypto.githubSignIn(s.token);
      if (!check.ok) {
        PSCrypto.githubSignOut();
        renderLogin(check.error);
        return;
      }
      renderDesk();
    }

    function renderLogin(errText) {
      $("admin-panel").innerHTML = `
        <form class="admin-card" id="login-form">
          <h2>Sign in with GitHub</h2>
          <p class="muted">You must be logged into GitHub as <strong>@itsyst</strong> (owner of python-strudy). Anyone else is rejected.</p>
          <ol class="muted" style="padding-left:1.2rem;display:grid;gap:0.4rem;margin:0 0 1rem">
            <li>Open GitHub and stay signed in as <strong>itsyst</strong>.</li>
            <li>Create a token with the <code>repo</code> scope (Contents write).</li>
            <li>Paste it here. It stays in this browser tab only.</li>
          </ol>
          <a class="tool-btn run-btn discord-btn" href="${TOKEN_URL}" target="_blank" rel="noopener">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.7 7.7 0 0 1 8 4.77a7.7 7.7 0 0 1 2.01.27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
            Open GitHub token page
          </a>
          <label class="field">GitHub token
            <input type="password" id="gh-token" autocomplete="off" spellcheck="false" required placeholder="ghp_… or github_pat_…" />
          </label>
          <p class="form-error" id="err" ${errText ? "" : "hidden"}>${errText || ""}</p>
          <button class="tool-btn run-btn" type="submit">Unlock as @itsyst</button>
        </form>`;
      $("login-form").onsubmit = async (e) => {
        e.preventDefault();
        const err = $("err");
        err.hidden = true;
        const res = await PSCrypto.githubSignIn($("gh-token").value);
        if (!res.ok) { err.hidden = false; err.textContent = res.error; return; }
        renderDesk();
      };
    }

    async function renderDesk() {
      const s = sess();
      const listed = await PSCrypto.listIssuedPublic();
      const rows = (listed.ok ? listed.codes : []).slice().reverse();
      const last = JSON.parse(sessionStorage.getItem("ps.v1.lastcodes") || "[]");
      $("admin-panel").innerHTML = `
        <div class="admin-card">
          <h2>Signed in as @${s.login}</h2>
          <p class="muted">Repo owner of itsyst/python-strudy. Codes are published to GitHub as hashes so students cannot invent their own.</p>
          <button class="tool-btn" type="button" id="lock-btn">Sign out</button>
        </div>
        <form class="admin-card" id="mint-form">
          <h2>Generate codes</h2>
          <p class="muted">Published to <code>assets/issued.json</code> in your repo, then post the codes in Discord.</p>
          <label class="field">How many
            <input type="number" id="count" min="1" max="20" value="5" />
          </label>
          <p class="form-error" id="err" hidden></p>
          <div class="btn-row">
            <button class="tool-btn run-btn" type="submit">Generate and publish</button>
            <button class="tool-btn" type="button" id="copy-live">Copy last codes</button>
          </div>
          <div id="fresh" class="code-list">${
            last.map((c) => `<button type="button" class="code-chip" data-code="${c.code}"><code>${c.code}</code><span>copy</span></button>`).join("")
          }</div>
        </form>
        <div class="admin-card">
          <h2>Issued on GitHub</h2>
          <p class="muted">${rows.length} live hashes in the repo (plaintext codes are not stored there)</p>
          <ul class="vault-list">${
            rows.length
              ? rows.map((c) => `<li><code>${(c.hash || "").slice(0, 12)}</code><span>until ${fmt(c.expires)}</span></li>`).join("")
              : "<li class='muted'>No issued codes yet.</li>"
          }</ul>
        </div>`;

      $("lock-btn").onclick = () => { PSCrypto.githubSignOut(); renderLogin(); };
      $("mint-form").onsubmit = async (e) => {
        e.preventDefault();
        const err = $("err");
        err.hidden = true;
        const res = await PSCrypto.generateOwnerCodes(s.token, $("count").value);
        if (!res.ok) { err.hidden = false; err.textContent = res.error; return; }
        sessionStorage.setItem("ps.v1.lastcodes", JSON.stringify(res.codes));
        renderDesk();
      };
      $("copy-live").onclick = () => {
        const text = last.map((c) => c.code).join("\n");
        if (text) navigator.clipboard.writeText(text);
      };
      $("fresh").querySelectorAll(".code-chip").forEach((btn) => {
        btn.onclick = () => navigator.clipboard.writeText(btn.dataset.code);
      });
    }

    render();
  </script>
</body>
</html>
